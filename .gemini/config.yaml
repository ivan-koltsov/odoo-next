# Gemini Code Assist configuration for GitHub Pull Requests
# Docs: https://developers.google.com/gemini-code-assist/docs/customize-gemini-behavior-github

have_fun: false

code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
    include_drafts: false

ignore_patterns:
  - "package-lock.json"
  - ".next/**"
  - "node_modules/**"
  - "coverage/**"
  - "next-env.d.ts"
  - "*.tsbuildinfo"
