services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your env file}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  odoo:
    image: odoo:18.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Bound to localhost only so Odoo is not exposed directly to the public internet.
    # Use http://localhost:8069 (or SSH port forwarding) for initial DB setup.
    ports:
      - "127.0.0.1:${ODOO_HOST_PORT:-8069}:8069"
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your env file}
    volumes:
      - odoo_web_data:/var/lib/odoo
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8069/web/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      odoo:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      ODOO_BASE_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB:-odoo}
      ODOO_TIMEOUT_MS: ${ODOO_TIMEOUT_MS:-15000}
      ODOO_SESSION_COOKIE_NAME: ${ODOO_SESSION_COOKIE_NAME:-odoo_session_id}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Odoo Next}
    networks:
      - internal

volumes:
  postgres_data:
  odoo_web_data:

networks:
  internal:
    driver: bridge
